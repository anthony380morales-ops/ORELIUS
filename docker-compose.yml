version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: oreilus-postgres
    environment:
      POSTGRES_USER: oreilus_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oreilus_password}
      POSTGRES_DB: oreilus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oreilus_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oreilus-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: oreilus-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-oreilus_redis}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oreilus-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oreilus-backend
    environment:
      DATABASE_URL: postgresql://oreilus_user:${POSTGRES_PASSWORD:-oreilus_password}@postgres:5432/oreilus
      REDIS_URL: redis://:${REDIS_PASSWORD:-oreilus_redis}@redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      MASTER_PASSWORD: ${MASTER_PASSWORD}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - oreilus-network
    restart: unless-stopped

  # Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oreilus-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend
    networks:
      - oreilus-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_logs:

networks:
  oreilus-network:
    driver: bridge
